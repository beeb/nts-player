[workspace]
resolver = "3"
members = ["firmware"]

[workspace.lints.clippy]
allow_attributes = "warn"
expect_used = "deny"
indexing_slicing = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
mod_module_files = "warn"
module_name_repetitions = "allow"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[profile.dev]
opt-level = "z"
debug = true  # this does not increase the size in flash

[profile.release]
opt-level = "s"

# the decoder is DSP code, size-optimizing it makes it much slower
[profile.dev.package.nanomp3]
opt-level = 3

[profile.dev.package.nanomp3-core]
opt-level = 3

[profile.release.package.nanomp3]
opt-level = 3

[profile.release.package.nanomp3-core]
opt-level = 3
