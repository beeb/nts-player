[build]
target = "xtensa-esp32s3-espidf"

[env]
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "firmware/sdkconfig.defaults", relative = true }
ESP_IDF_SYS_ROOT_CRATE = "nts-player"
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
ESP_IDF_VERSION = "v5.5.5"
MCU = "esp32s3"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --baud 921600 --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]
